services:
  mongodb:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - campusconnection-mongo:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/admin | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['mongosh', 'mongodb://mongodb:27017/admin', '--quiet', '--eval']
    command:
      - >-
        try { rs.status() } catch (e) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
        }

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - campusconnection-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  campusconnection-mongo:
  campusconnection-redis:
